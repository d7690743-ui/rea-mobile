plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nexos.reamobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexos.reamobile'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    signingConfigs {
        // Clave debug FIJA y común a todos los proyectos Nexos.
        debug {
            storeFile file("../gradle/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Cero dependencias en la app: 100% framework + motor REA en Java puro.
// Solo JUnit para el test unitario puro (SmaliExtractTest).
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
