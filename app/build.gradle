plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nexos.reamobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexos.reamobile'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '0.5.0'
    }

    signingConfigs {
        // Clave debug FIJA y común a todos los proyectos Nexos.
        debug {
            storeFile file("../gradle/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Interno: firmado con la misma clave debug fija (ver arriba).
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Motor REA en Java puro + framework; dependencias justificadas abajo.
// JADX (Apache 2.0, ver README): solo core + entrada dex, sin GUI ni CLI.
// apksig (Apache 2.0, Google, misma versión que el AGP): verificación
// criptográfica oficial v1/v2/v3/v3.1 + Source Stamp + linaje de rotación
// para el REA APK Authenticity Engine (con respaldo interno si falta).
// Solo JUnit para los tests unitarios puros.
dependencies {
    implementation 'io.github.skylot:jadx-core:1.5.2'
    implementation 'io.github.skylot:jadx-dex-input:1.5.2'
    implementation 'com.android.tools.build:apksig:8.7.3'
    testImplementation 'junit:junit:4.13.2'
}
